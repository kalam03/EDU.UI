<div class="panel">
  <div class="panel-header">
    <span class="panel-title">{{ isEdit ? 'Edit Section' : 'Add Section' }}</span>
    <a routerLink="/sections" class="btn-outline-light">&#8592; Back</a>
  </div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="panel-body">
      @if (error) { <div class="alert alert-danger">{{ error }}</div> }
      <div class="grid-2">
        <div class="form-group">
          <label>Section Name <span class="required">*</span></label>
          <input type="text" class="form-control"
            [class.is-invalid]="form.get('sectionName')!.invalid && form.get('sectionName')!.touched"
            formControlName="sectionName" placeholder="e.g. A, B, Morning" />
          @if (form.get('sectionName')!.invalid && form.get('sectionName')!.touched) {
            <div class="invalid-feedback">Section name is required.</div>
          }
        </div>
        <div class="form-group">
          <label>Class <span class="required">*</span></label>
          <app-searchable-select [options]="classOptions" formControlName="classId" placeholder="Select Class"></app-searchable-select>
          @if (form.get('classId')!.invalid && form.get('classId')!.touched) {
            <div class="invalid-feedback">Class is required.</div>
          }
        </div>
      </div>
      <div class="form-group">
        <label>School EIIN</label>
        <input type="text" class="form-control" formControlName="schoolEiin" placeholder="School EIIN" />
      </div>
    </div>
    <div class="panel-footer">
      <a routerLink="/sections" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEdit ? 'Update Section' : 'Add Section') }}
      </button>
    </div>
  </form>
</div>
