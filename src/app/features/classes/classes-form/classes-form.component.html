<div class="panel">
  <div class="panel-header">
    <span class="panel-title">{{ isEdit ? 'Edit Class' : 'Add Class' }}</span>
    <a routerLink="/classes" class="btn-outline-light"><app-icon name="arrow-left" [size]="14"></app-icon> Back</a>
  </div>
  @if (loading) {
    <div class="panel-body"><div class="form-loading">Loading...</div></div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="panel-body">
        @if (error) { <div class="alert alert-danger">{{ error }}</div> }
        <div class="grid-2">
          <div class="form-group">
            <label>Class Name <span class="required">*</span></label>
            <input type="text" class="form-control"
              [class.is-invalid]="form.get('className')!.invalid && form.get('className')!.touched"
              formControlName="className" placeholder="e.g. Class 1, Grade 6" />
            @if (form.get('className')!.invalid && form.get('className')!.touched) {
              <div class="invalid-feedback">Class name is required.</div>
            }
          </div>
          <div class="form-group">
            <label>Class Code</label>
            <input type="text" class="form-control" formControlName="classCode" placeholder="e.g. CLS1" />
          </div>
        </div>
        <div class="form-group">
          <label>School EIIN</label>
          <input type="text" class="form-control" formControlName="schoolEiin" placeholder="School EIIN" />
        </div>
      </div>
      <div class="panel-footer">
        <a routerLink="/classes" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEdit ? 'Update Class' : 'Add Class') }}
        </button>
      </div>
    </form>
  }
</div>
