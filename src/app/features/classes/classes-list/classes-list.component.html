<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Classes</span>
    <a routerLink="/classes/new" class="btn-outline-light">+ Add Class</a>
  </div>
  <div class="panel-body">
    <app-data-table
      [columns]="columns"
      [data]="$any(classes)"
      [loading]="loading"
      searchPlaceholder="Search classes..."
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  </div>
</div>
