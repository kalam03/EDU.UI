<div class="panel">
  <div class="panel-header">
    <span class="panel-title">{{ isEdit ? 'Edit Exam' : 'Add Exam' }}</span>
    <a routerLink="/exams" class="btn-outline-light">&#8592; Back</a>
  </div>
  @if (loading) {
    <div class="panel-body"><div class="form-loading">Loading...</div></div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="panel-body">
        @if (error) { <div class="alert alert-danger">{{ error }}</div> }
        <div class="grid-2">
          <div class="form-group">
            <label>Exam Name <span class="required">*</span></label>
            <input type="text" class="form-control"
              [class.is-invalid]="form.get('examName')!.invalid && form.get('examName')!.touched"
              formControlName="examName" placeholder="e.g. First Term, Annual Exam" />
            @if (form.get('examName')!.invalid && form.get('examName')!.touched) {
              <div class="invalid-feedback">Exam name is required.</div>
            }
          </div>
          <div class="form-group">
            <label>Class</label>
            <app-searchable-dropdown [options]="classOptions" formControlName="classId" placeholder="Select Class"></app-searchable-dropdown>
          </div>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label>Exam Date</label>
            <app-custom-datepicker formControlName="examDate"></app-custom-datepicker>
          </div>
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" class="form-control" formControlName="startTime" />
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" class="form-control" formControlName="endTime" />
          </div>
        </div>
        <div class="form-group">
          <label>School EIIN</label>
          <input type="text" class="form-control" formControlName="schoolEiin" placeholder="School EIIN" />
        </div>
      </div>
      <div class="panel-footer">
        <a routerLink="/exams" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEdit ? 'Update Exam' : 'Add Exam') }}
        </button>
      </div>
    </form>
  }
</div>
