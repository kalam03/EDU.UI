<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Exams</span>
    <a routerLink="/exams/new" class="btn-outline-light">+ Add Exam</a>
  </div>
  <div class="panel-body">
    <app-data-table
      [columns]="columns"
      [data]="$any(exams)"
      [loading]="loading"
      [totalCount]="exams.length"
      [showSearch]="false"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  </div>
</div>
