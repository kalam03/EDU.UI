<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Marksheet</h2>
    <p class="panel-subtitle">Generate student progress report / marksheet as PDF</p>
  </div>

  <div class="panel-body">

    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <div class="ms-form-grid">

      <!-- Class -->
      <div class="form-group">
        <label class="form-label">Class <span class="required">*</span></label>
        <app-searchable-select
          [options]="classOptions"
          placeholder="Select class..."
          (valueChange)="onClassSelect($event)">
        </app-searchable-select>
      </div>

      <!-- Student -->
      <div class="form-group">
        <label class="form-label">
          Student <span class="required">*</span>
          @if (loading) { <span class="hint">Loading...</span> }
        </label>
        <app-searchable-select
          [options]="studentOptions"
          placeholder="Select student..."
          [disabled]="loading || !selectedClassId"
          (valueChange)="onStudentSelect($event)">
        </app-searchable-select>
      </div>

      <!-- Exam -->
      <div class="form-group">
        <label class="form-label">Exam <span class="required">*</span></label>
        <app-searchable-select
          [options]="examOptions"
          placeholder="Select exam..."
          (valueChange)="onExamSelect($event)">
        </app-searchable-select>
      </div>

    </div>

    <div class="ms-actions">
      <button class="btn btn-primary" [disabled]="!canGenerate" (click)="generateMarksheet()">
        @if (generating) {
          <span class="btn-spinner"></span> Generating...
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
            <path d="M4.5 12.5A.5.5 0 0 1 5 12h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0-2A.5.5 0 0 1 5 10h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0-2A.5.5 0 0 1 5 8h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5z"/>
          </svg>
          Generate PDF Marksheet
        }
      </button>
    </div>

    <div class="ms-info">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
      </svg>
      The PDF opens in a new tab. Make sure marks have been entered for the selected student and exam before generating.
    </div>

  </div>
</div>
