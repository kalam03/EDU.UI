<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Subjects</span>
    <a routerLink="/subjects/new" class="btn-outline-light">+ Add Subject</a>
  </div>
  <div class="panel-body">
    <app-data-table
      [columns]="columns"
      [data]="$any(subjects)"
      [loading]="loading"
      [totalCount]="subjects.length"
      [showSearch]="false"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  </div>
</div>
